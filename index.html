<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace.js"
    ></script>
    <style>
      :root {
        --max-width: 75ch;
        --gap: 1rem;
        --sl-font-sans: "Inter", system-ui, sans-serif;
      }
      body {
        font-family: var(--sl-font-sans);
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        margin: 0;
      }
      .spinner-page {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 1rem;
      }
    </style>
    <script type="module" src="js/assembly-login.js"></script>
    <script type="module" src="js/assembly-save.js"></script>
    <script type="module" src="js/assembly-home.js"></script>
    <title>Assembly</title>
  </head>
  <body>
    <div id="page">
      <div class="spinner-page">
        <sl-spinner style="--size: 50vw"></sl-spinner>
      </div>
    </div>
    <script type="module">
      const redirect_uri = window.location.origin + window.location.pathname;
      const client_id = (new URL('cimd.json', window.location.href)).toString();

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        document.getElementById("page").innerHTML = params.get("state")
          ? `<assembly-save
                client-id=${client_id}
                redirect-uri=${redirect_uri}
                success-uri=${redirect_uri}
              />`
          : !localStorage.getItem("access_token")
            ? `<assembly-login
                client-id=${client_id}
                redirect-uri=${redirect_uri} />`
            : `<assembly-home
                client-id=${client_id}
                redirect-uri=${redirect_uri} />`;
      });
    </script>
  </body>
</html>
